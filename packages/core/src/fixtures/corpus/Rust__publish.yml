when:
  - event: tag
    ref: refs/tags/v*
  - event: release
# Enable releases at: <your repo on Codeberg> > Settings > Units > Overview > Enable repository releases.

steps:
  publish:
    image: rust
    environment:
      CARGO_TERM_COLOR: always
      # Add your registry token at: https://ci.codeberg.org/ > <your_repo> > Settings (gear) > Secrets
      CARGO_REGISTRY_TOKEN:
        from_secret: CARGO_REGISTRY_TOKEN
    commands:
      - rustup default stable
      - cargo publish
